<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2315141a'/><rect x='7' y='8' width='18' height='3' fill='%23ffb454'/><rect x='7' y='15' width='18' height='2' fill='%23726b85'/><rect x='7' y='20' width='18' height='2' fill='%23726b85'/></svg>" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">Calendar</span>
    <span class="brand-clock mono" id="brandClock">--:--</span>
  </div>
  <nav class="nav" id="nav">
    <button class="nav-btn is-active" data-view="dashboard">Dashboard</button>
    <button class="nav-btn" data-view="session">Study</button>
    <button class="nav-btn" data-view="todos">To-dos</button>
    <button class="nav-btn" data-view="calendar">Calendar</button>
    <button class="nav-btn" data-view="analytics">Analytics</button>
    <button class="nav-btn" data-view="settings">Setup</button>
  </nav>
  <div class="topbar-right">
    <button class="icon-btn" id="themeToggle" title="Next colour scheme">◐</button>
  </div>
</header>

<main id="app"></main>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="./js/store.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/dashboard.js"></script>
<script src="./js/todos.js"></script>
<script src="./js/session.js"></script>
<script src="./js/calendarview.js"></script>
<script src="./js/analytics.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
